<title>Leave A Note – Leave A Note on the WWW for future generations </title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Leave A Note for future generations to see">

<meta name="keywords" content="Leave A Note, notes, anonymous notes, drawing notes,leavenotes,notes">

<meta name="author" content="Leave A Note">

<meta name="robots" content="index, follow">

<link rel="canonical" href="https://leaveanote.xyz/">

<meta property="og:title" content="Leave A Note">
<meta property="og:description" content="Leave a message for the people who come after.">
<meta property="og:image" content="https://leaveanote.xyz/images/preview.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Leave A Note">

<meta name="twitter:image" content="https://leaveanote.xyz/images/preview.png">

<script type="application/ld+json">
{
"@context":"https://schema.org",
"@type":"WebSite",
"name":"Leave A Note",
"url":"https://leaveanote.xyz/"
}
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="home">
  <img class="main" src="images/Leave_A_Note__1_-removebg-preview.png">
  <img class="update" src="images/new_update-removebg-preview.png">
</div>

<div id="addNoteBtn" style="display:none;">Write a Note</div>

<div id="map-container">
  <div id="map"></div>
</div>

<div id="editor">
  <div id="cancelBtn">
    <i class="fa-solid fa-circle-xmark"></i>
  </div>

  <canvas id="canvas" width="500" height="500"></canvas>

  <div class="tools">
    <i onclick="setTool('draw')" class="fa-solid fa-pen"></i>
    <i onclick="setTool('erase')" class="fa-solid fa-eraser"></i>
    <i onclick="setTool('text')" class="fa-solid fa-keyboard" style="color: rgb(30, 48, 80);"></i>
    <input type="color" id="colorPicker">
    <input type="range" id="fontSize" min="10" max="60" value="24">
    <button onclick="finishNote()">Done</button>
  </div>
</div>

<script type="module" src="script.js"></script>
<!-- celebration for 100 notes lets gogoogogogogoooo -->

</body>
